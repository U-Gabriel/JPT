name: Deploy API
on:
  push:
    branches: [ main ] # Se déclenche quand on pousse sur main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: debian
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /var/www/ajpt/ajpt
            git pull origin main
            npm install --omit=dev
            pm2 restart ajpt || pm2 start index.mjs --name "ajpt"
            pm2 restart ajpt_worker || pm2 start notifications/worker.mjs --name "ajpt"
            pm2 save
            pm2 restart ajpt
